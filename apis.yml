description: >
  SuperAnnotate is an AI data annotation platform purpose-built for computer
  vision and NLP teams that need to build, fine-tune, and iterate machine
  learning models with high-quality training data. The platform provides a
  Python SDK and REST API for managing annotation projects, datasets, folders,
  items, annotation classes, exports, and team workflows programmatically.
  SuperAnnotate's Orchestrate module enables event-driven automation pipelines
  with configurable compute hours, while Agent Hub offers MCP server integration
  for AI agent workflows. The platform integrates natively with AWS, GCP, Azure,
  Databricks, and Snowflake, supporting enterprise-grade data governance and
  security requirements.
